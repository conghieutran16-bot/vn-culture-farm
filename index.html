<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#bfe6f5">
<title>越南文化农场 · Vietnamese Cultural Farm</title>
<style>
:root{
  --wood:#8a5a32; --wood-d:#5e3a1c; --wood-l:#b07a46;
  --leaf:#4f9a3c; --leaf-d:#336b25;
  --cream:#fff8e8; --cream-d:#f0dfb8; --sun:#f6c445; --berry:#c8402f;
  --ink:#3b2a1a; --muted:#7a6650;
  --r:22px; --shadow:0 6px 0 rgba(94,58,28,.35), 0 14px 28px rgba(40,30,10,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{background:#cfe9f5}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Noto Sans",sans-serif;
  color:var(--ink);background:#cfe9f5;-webkit-text-size-adjust:100%;
}
/* painted background: sky + meadow photo, fixed behind everything */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(#a9dcf2 0,#d6eef7 45%,#eef7e2 75%,#d9eebd 100%)}
.bg svg{position:absolute;left:0;bottom:0;width:100%;height:42vh;min-height:260px}
.bg .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:cloud 60s linear infinite}
.bg .cloud:before,.bg .cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.bg .cloud:before{width:46%;height:150%;left:16%;top:-60%}.bg .cloud:after{width:36%;height:120%;right:14%;top:-40%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.app{position:relative;z-index:2;max-width:520px;margin:0 auto;min-height:100vh;overflow-x:hidden}

/* drifting leaves & beans */
.drift{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.drift i{position:absolute;top:-40px;width:22px;height:22px;opacity:.85;animation:fall linear infinite}
.drift i.l{background:var(--leaf);border-radius:0 70% 0 70%}
.drift i.b{width:14px;height:18px;background:#6b3e1f;border-radius:50%;box-shadow:inset -3px 0 0 #3d220f}
@keyframes fall{0%{transform:translate(0,-40px) rotate(0)}50%{transform:translate(40px,55vh) rotate(180deg)}100%{transform:translate(-10px,110vh) rotate(360deg)}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.iconbtn{width:44px;height:44px;border-radius:15px;border:0;background:var(--cream);
  box-shadow:0 4px 0 var(--wood-l),0 6px 12px rgba(0,0,0,.12);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-l)}
.iconbtn svg{width:22px;height:22px}
.iconbtn.hidden{visibility:hidden}
.spacer{flex:1}
.lang{display:flex;background:var(--wood);border-radius:15px;padding:3px;box-shadow:0 4px 0 var(--wood-d),0 6px 12px rgba(0,0,0,.15)}
.lang button{border:0;background:transparent;color:var(--cream);font-weight:800;font-size:14px;
  padding:9px 12px;border-radius:12px;cursor:pointer;font-family:inherit}
.lang button.on{background:var(--sun);color:var(--wood-d)}

/* screens */
.screen{display:none;padding:4px 16px calc(32px + env(safe-area-inset-bottom))}
.screen.active{display:block;animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* hanging wooden sign */
.sign{scroll-margin-top:80px;position:relative;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 3px,transparent 3px 11px),linear-gradient(var(--wood-l),var(--wood));
  color:#fff8e8;border-radius:18px;padding:14px 22px;text-align:center;box-shadow:var(--shadow);
  border:3px solid var(--wood-d);margin:26px auto 18px}
.sign:before,.sign:after{content:"";position:absolute;top:-26px;width:3px;height:26px;background:var(--wood-d)}
.sign:before{left:22%}.sign:after{right:22%}
.sign h1,.sign h2{margin:0;line-height:1.3;text-shadow:0 2px 0 rgba(0,0,0,.28);letter-spacing:.5px}
.sign h1{font-size:27px}.sign h2{font-size:22px}
.sign .sub{margin-top:4px;font-size:14px;opacity:.92}

.card{background:var(--cream);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid var(--cream-d);
  padding:16px;margin-bottom:18px}
.card h3{margin:0 0 6px;font-size:19px;color:var(--wood-d)}
.card p{margin:6px 0;line-height:1.65;font-size:15.5px}
.muted{color:var(--muted);font-size:13.5px!important}
.tag{display:inline-block;background:var(--leaf);color:#fff;font-size:12.5px;font-weight:800;
  padding:4px 12px;border-radius:999px;margin-bottom:8px;box-shadow:0 3px 0 var(--leaf-d)}
.orig{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
html[lang="vi"] .orig{display:none}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:18px;color:#fff;padding:15px 18px;border-radius:18px;
  background:linear-gradient(#5fae49,var(--leaf-d));box-shadow:0 6px 0 #234a19,0 10px 18px rgba(0,0,0,.15);margin:12px 0}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #234a19}
.btn.wood{background:linear-gradient(var(--wood-l),var(--wood));box-shadow:0 6px 0 var(--wood-d),0 10px 18px rgba(0,0,0,.15)}
.btn.sun{background:linear-gradient(#ffd866,var(--sun));color:var(--wood-d);box-shadow:0 6px 0 #c08f17,0 10px 18px rgba(0,0,0,.15)}
.btn.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

/* photos */
.fig{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;margin-bottom:12px;
  background:linear-gradient(135deg,#ffe7a8,#bfe3a0);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.fig.tall{aspect-ratio:4/5}.fig.tall2{aspect-ratio:2/3;max-width:78%;margin-left:auto;margin-right:auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.duo .fig{aspect-ratio:4/5;margin-bottom:0}.duocap{font-size:12px;opacity:.7;text-align:center;margin:6px 0 4px}
.fig svg{width:46%;height:auto}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fig .cap{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(0,0,0,.5);color:#fff;font-size:11px;
  padding:3px 8px;border-radius:999px;display:none}
.fig.loaded .cap{display:block}

/* splash */
.logos{display:flex;justify-content:center;align-items:center;gap:14px;background:rgba(255,255,255,.88);
  border-radius:999px;padding:8px 18px;width:max-content;margin:4px auto 0;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.logos img{height:46px;width:auto;display:block}
.hero{text-align:center}
.hero .art{width:100%;max-width:380px;margin:4px auto -14px;display:block}
.ribbon{display:inline-block;position:relative;background:var(--berry);color:#fff;font-weight:800;font-size:14.5px;
  padding:8px 22px;margin:4px 0 6px;box-shadow:0 4px 0 #8c2a1e}
.ribbon:before,.ribbon:after{content:"";position:absolute;top:6px;border:16px solid #a8331f;z-index:-1}
.ribbon:before{left:-20px;border-left-color:transparent}.ribbon:after{right:-20px;border-right-color:transparent}
.lead{font-size:16px;line-height:1.65;margin:12px 4px 10px;background:rgba(255,248,232,.85);border-radius:16px;padding:12px 14px}

/* hub: signpost cards */
.post{display:flex;gap:14px;align-items:center;text-align:left;cursor:pointer;position:relative;padding:14px 16px 14px 14px}
.post .ic{flex:0 0 74px;height:74px;border-radius:20px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.post .ic svg{width:50px;height:50px}
.post h3{margin:0 0 2px}
.post p{margin:0;font-size:14.5px;color:var(--muted)}
.post .go{margin-left:auto;width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--sun);color:var(--wood-d);
  display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 3px 0 #c08f17}
.post .done{position:absolute;top:-8px;right:-6px;background:var(--leaf);color:#fff;font-size:11.5px;font-weight:800;
  padding:3px 9px;border-radius:999px;box-shadow:0 2px 0 var(--leaf-d);display:none}
.post.visited .done{display:block}
.scene{width:100%;display:block;margin:-6px 0 6px}

/* carousel */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding:4px 4px 14px;
  margin:0 -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center}
.slide .card{margin-bottom:6px;min-height:100%}
.ctrl{display:flex;align-items:center;gap:10px}
.ctrl .btn{margin:0;font-size:16px;padding:13px}
.beans{display:flex;justify-content:center;gap:9px;margin:4px 0 14px}
.beans i{width:14px;height:18px;border-radius:50%;background:rgba(255,248,232,.9);border:2px solid var(--wood-l);transition:.25s}
.beans i.on{background:#6b3e1f;border-color:#3d220f;transform:scale(1.2) rotate(20deg)}

/* phin brew toy */
.brew{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:10px 12px;margin-top:10px;border:2px dashed var(--cream-d)}
.brew svg{flex:0 0 86px;height:110px}
.brew .bbtn{border:0;background:var(--berry);color:#fff;font-weight:800;font-family:inherit;font-size:15px;
  padding:10px 14px;border-radius:14px;box-shadow:0 4px 0 #8c2a1e;cursor:pointer}
.brew .bbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #8c2a1e}
.brew .msg{font-size:14px;color:var(--leaf-d);font-weight:700;margin-top:6px;min-height:20px}
.drop{opacity:0}
.brewing .drop{animation:drip 1s ease-in infinite}
.brewing .drop.d2{animation-delay:.5s}
@keyframes drip{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
#coffeeLevel{transition:all 4s linear}

/* drinks grid & spaces */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.drink{background:var(--cream);border-radius:18px;border:2px solid var(--cream-d);box-shadow:0 5px 0 rgba(94,58,28,.3),0 10px 18px rgba(0,0,0,.1);overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:inherit}
.drink .fig{aspect-ratio:1/1;margin:0;border:0;border-radius:0;box-shadow:none}
.drink .kind{position:absolute;left:8px;top:8px;z-index:2;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;color:#fff;background:var(--wood)}
.drink .kind.new{background:var(--leaf)}
.drink .nm{padding:9px 10px 2px;font-weight:800;color:var(--wood-d);font-size:15px;line-height:1.3}
.drink .vn{padding:0 10px 10px;font-size:12.5px;color:var(--muted);font-weight:600}
.drink .ds{display:none;padding:0 10px 12px;font-size:13.5px;line-height:1.55}
.drink.open .ds{display:block}
.drink.open{grid-column:1/-1}
.drink.open .fig{aspect-ratio:16/10}
.tapme{text-align:center;font-size:13px;color:var(--wood-d);margin:-8px 0 10px}
.quote{text-align:center;font-weight:700;color:var(--wood-d);background:linear-gradient(#fff3cf,var(--cream))}
html[lang="vi"] .drink .vn{display:none}

/* arts */
.item{border-top:2px dashed var(--cream-d);padding-top:14px;margin-top:14px}
.item h4{margin:0 0 4px;font-size:17px;color:var(--leaf-d)}
.credit{background:#fff;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;color:var(--muted);margin-top:10px;border-left:4px solid var(--sun)}
.credit b{color:var(--ink)}

/* stage */
.stage{position:relative;border-radius:26px;overflow:hidden;padding:76px 14px 8px;margin-bottom:18px;border:4px solid var(--wood-d);box-shadow:var(--shadow);
  background:radial-gradient(ellipse at 50% 18%,#ffe9a8 0,#e06a3a 38%,#7a2414 75%,#3b0f08 100%)}
.curtain{position:absolute;left:0;right:0;top:0;height:64px;pointer-events:none}
.beam{position:absolute;top:0;width:120px;height:100%;background:linear-gradient(rgba(255,240,180,.35),transparent 70%);
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);pointer-events:none;mix-blend-mode:screen;opacity:.6;transition:opacity .4s}
.beam.b1{left:4%;transform:rotate(-12deg)}.beam.b2{right:4%;transform:rotate(12deg)}
.stage.live .beam{opacity:1;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{to{filter:brightness(1.3)}}
.stagenote{position:relative;color:#fff3d6;text-align:center;margin:0 6px 12px;font-size:13.5px}
.track{position:relative;background:rgba(255,248,232,.97);border-radius:18px;padding:14px;margin-bottom:12px;transition:transform .2s}
.track.playing{transform:scale(1.02);box-shadow:0 0 0 3px var(--sun),0 8px 22px rgba(0,0,0,.25)}
.track .row{display:flex;align-items:center;gap:12px}
.play{flex:0 0 58px;height:58px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(#ff7a5c,var(--berry));box-shadow:0 5px 0 #8c2a1e;display:grid;place-items:center}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #8c2a1e}
.play svg{width:24px;height:24px;fill:#fff}
.play[disabled]{background:#c9bba6;box-shadow:0 5px 0 #9a8a72}
.track h3{margin:0;font-size:17px;color:var(--wood-d)}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;margin-left:auto}
.eq i{width:4px;height:4px;background:var(--berry);border-radius:2px}
.track.playing .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}.eq i:nth-child(4){animation-delay:.1s!important}
@keyframes eq{from{height:4px}to{height:22px}}
.bar{position:relative;height:28px;margin-top:6px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.bar:before{content:"";position:absolute;left:0;right:0;top:10px;height:8px;background:var(--cream-d);border-radius:5px}
.bar i{position:absolute;left:0;top:10px;height:8px;width:0;border-radius:5px;background:linear-gradient(90deg,var(--sun),var(--berry))}
.bar b{position:absolute;top:4px;left:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;border:3px solid var(--berry);box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .15s}
.bar.drag b{transform:scale(1.3)}
.time{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.skip{border:0;background:var(--cream-d);color:var(--wood-d);font-family:inherit;font-weight:800;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer}
.skip:active{transform:translateY(1px)}
.skips{display:flex;gap:8px}
.soon{font-size:13px;color:var(--berry);font-weight:600;margin-top:8px}

/* thanks postcard */
.postcard{background:var(--cream);border-radius:24px;padding:24px 18px 22px;text-align:center;
  border:3px solid var(--wood);box-shadow:var(--shadow);position:relative;overflow:hidden}
.postcard:before{content:"";position:absolute;inset:8px;border:2px dashed var(--wood-l);border-radius:18px;pointer-events:none}
.stamp{position:absolute;top:16px;right:16px;width:58px;height:66px;background:#fff;padding:4px;transform:rotate(6deg);
  box-shadow:0 2px 6px rgba(0,0,0,.15);border:2px dotted var(--wood-l)}
.stamp div{width:100%;height:100%;background:linear-gradient(#ffe39a,#f6c445);display:grid;place-items:center}
.postcard .logos{box-shadow:none;background:transparent;padding:0;margin:4px auto 6px}
.postcard .logos img{height:54px}
.postcard h2{font-size:21px;color:var(--wood-d);margin:12px 0 8px}
.postcard p{line-height:1.75;margin:8px 4px}
.postcard .from{margin-top:16px;font-weight:700;color:var(--leaf-d);font-size:14.5px;line-height:1.6}
.postcard .date{color:var(--muted);font-size:13.5px;margin-top:6px}
.hint{text-align:center;color:var(--wood-d);font-size:14px;margin:12px 0;background:rgba(255,248,232,.85);border-radius:999px;padding:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:conf 2.4s ease-in forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
  .drift{display:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="cloud" style="top:9%;left:0;width:90px;height:26px;animation-delay:-12s"></i>
  <i class="cloud" style="top:20%;left:0;width:64px;height:20px;animation-duration:80s;animation-delay:-50s"></i>
  <i class="cloud" style="top:31%;left:0;width:110px;height:30px;animation-duration:95s;animation-delay:-30s"></i>
  <svg viewBox="0 0 400 300" preserveAspectRatio="none">
    <circle cx="330" cy="70" r="34" fill="#ffe08a" opacity=".9"/>
    <path d="M0 150 C80 100 150 120 220 140 C290 160 340 110 400 120 V300 H0Z" fill="#b9dc8e"/>
    <path d="M0 190 C70 160 140 175 200 190 C270 208 330 165 400 175 V300 H0Z" fill="#8fc65f"/>
    <g stroke="#6fae47" stroke-width="2" opacity=".7" fill="none">
      <path d="M0 225 C90 205 170 220 260 232 C320 240 360 222 400 220"/><path d="M0 250 C90 232 180 246 270 256 C330 262 370 248 400 246"/>
    </g>
    <path d="M0 240 C90 215 180 235 260 245 C330 254 370 236 400 232 V300 H0Z" fill="#6fae47"/>
    <g fill="#4f9a3c"><circle cx="40" cy="232" r="14"/><circle cx="58" cy="236" r="10"/><circle cx="350" cy="228" r="13"/><circle cx="368" cy="232" r="9"/></g>
    <g fill="#c8402f"><circle cx="36" cy="228" r="2.5"/><circle cx="46" cy="236" r="2.5"/><circle cx="352" cy="224" r="2.5"/><circle cx="360" cy="232" r="2.5"/></g>
  </svg>
</div>
<div class="drift" id="drift" aria-hidden="true"></div>
<div class="app">

<header class="topbar">
  <button class="iconbtn hidden" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="#5e3a1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="iconbtn hidden" id="homeBtn" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="#5e3a1c"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
  </button>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="zh">中</button><button data-lang="en">EN</button><button data-lang="vi">VI</button>
  </div>
</header>

<!-- ============ SPLASH ============ -->
<section class="screen" id="s-home">
  <div class="hero">
    <div class="logos">
      <img src="assets/logo-ussh.webp" alt="USSH, VNU-HCM">
      <img src="assets/logo-khoa.webp" alt="Faculty of English Linguistics and Literature">
    </div>
    <svg class="art" viewBox="0 0 380 190" aria-hidden="true">
      <!-- stilt hut -->
      <g transform="translate(18 40)">
        <rect x="14" y="70" width="6" height="40" fill="#7a4a24"/><rect x="88" y="70" width="6" height="40" fill="#7a4a24"/>
        <rect x="10" y="50" width="88" height="26" rx="3" fill="#c98f55"/>
        <path d="M0 54 L54 10 L108 54Z" fill="#e8bd66" stroke="#a57a32" stroke-width="3" stroke-linejoin="round"/>
        <path d="M20 44 L54 18 L88 44" stroke="#d1a24a" stroke-width="2" fill="none"/>
        <rect x="46" y="56" width="16" height="20" fill="#6b3e1f"/>
      </g>
      <!-- conical hat -->
      <g transform="translate(150 98)">
        <ellipse cx="40" cy="44" rx="44" ry="7" fill="rgba(0,0,0,.12)"/>
        <path d="M0 40 L40 2 L80 40Z" fill="#f4d98f" stroke="#b8913e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14 28 L66 28 M24 18 L56 18" stroke="#cfa64e" stroke-width="2"/>
      </g>
      <!-- coffee tree -->
      <g transform="translate(262 40)">
        <path d="M50 140 C48 100 52 60 50 20" stroke="#5c3b1f" stroke-width="6" fill="none"/>
        <g fill="#4f9a3c">

var lang = "zh", saved = null;
try { saved = localStorage.getItem("vnfarm-lang"); if (saved && /^(zh|en|vi)$/.test(saved)) lang = saved; } catch(e){}
if (!saved) { try { if ((navigator.language||"").toLowerCase().indexOf("vi")===0) lang="vi"; } catch(e){} }

function tr(key){ var v=T[key]; return v ? (v[lang]||v.en) : key; }
function applyLang(){
  document.documentElement.lang = lang==="zh" ? "zh-CN" : lang;
  document.querySelectorAll("[data-i]").forEach(function(el){ el.innerHTML = tr(el.getAttribute("data-i")); });
  document.querySelectorAll(".lang button").forEach(function(b){ b.classList.toggle("on", b.dataset.lang===lang); });
  renderSteps();
  renderMenu();
}
document.querySelectorAll(".lang button").forEach(function(b){
  b.addEventListener("click", function(){ lang=b.dataset.lang; try{localStorage.setItem("vnfarm-lang",lang);}catch(e){} applyLang(); });
});

/* photos: show the real image if it loads, otherwise keep the drawn placeholder */
function loadFig(fig){
  var src = fig.getAttribute("data-img"); if(!src || fig.querySelector("img")) return;
  var img = new Image(); img.alt="";
  img.onload = function(){ fig.insertBefore(img, fig.querySelector(".cap")); fig.classList.add("loaded"); };
  img.src = src;
}

/* drifting leaves & beans */
(function(){
  var d=document.getElementById("drift"), h="";
  for(var i=0;i<9;i++){
    var bean=i%3===0, left=Math.round(Math.random()*95), dur=(9+Math.random()*9).toFixed(1), delay=(-Math.random()*15).toFixed(1);
    h+='<i class="'+(bean?'b':'l')+'" style="left:'+left+'%;animation-duration:'+dur+'s;animation-delay:'+delay+'s"></i>';

/* coffee carousel */
var car=document.getElementById("carousel"), dots=document.getElementById("dots"), idx=0, brewed=false;
function renderSteps(){
  car.innerHTML = STEPS.map(function(s){
    var brew = s.brew ? '<div class="brew" id="brewBox">'+PHIN_SVG+'<div><button class="bbtn" id="brewBtn">'+tr("brew.btn")+'</button><div class="msg" id="brewMsg"></div></div></div>' : '';
    return '<div class="slide"><div class="card"><div class="fig" data-img="'+s.img+'">'+BEAN_ICON+'<span class="cap">'+tr("img.note")+'</span></div>'+
      '<h3>'+s.t[lang]+'</h3><p>'+s.d[lang]+'</p>'+brew+'</div></div>';
  }).join("");
  dots.innerHTML = STEPS.map(function(){return "<i></i>";}).join("");
  car.querySelectorAll(".fig").forEach(loadFig);
  brewed=false;
  document.getElementById("brewBtn").onclick=brew;
  setTimeout(function(){ goStep(idx, true); }, 0);
}
function brew(){
  if(brewed) return; brewed=true;
  var box=document.getElementById("brewBox"), lvl=document.getElementById("coffeeLevel"), msg=document.getElementById("brewMsg");
  box.classList.add("brewing"); msg.textContent=tr("brew.wait");
  requestAnimationFrame(function(){ lvl.setAttribute("y","62"); lvl.setAttribute("height","42"); });
  setTimeout(function(){ box.classList.remove("brewing"); msg.textContent=tr("brew.done"); }, 4200);
}
function goStep(i, instant){
  idx = Math.max(0, Math.min(STEPS.length-1, i));
  car.scrollTo({left: idx*(car.clientWidth+14), behavior: instant?"auto":"smooth"});
  updateDots();
}
function updateDots(){
  dots.querySelectorAll("i").forEach(function(d,k){ d.classList.toggle("on", k<=idx); });
  document.getElementById("prevBtn").style.visibility = idx===0 ? "hidden" : "visible";
  var last = idx===STEPS.length-1;
  document.getElementById("nextBtn").style.display = last ? "none" : "flex";
  document.getElementById("coffeeDone").style.display = last ? "flex" : "none";
}
var st;
car.addEventListener("scroll", function(){
  clearTimeout(st); st=setTimeout(function(){
    var i = Math.round(car.scrollLeft/(car.clientWidth+14)); if(i!==idx){ idx=i; updateDots(); }
  },80);
});
document.getElementById("coffeeDone").onclick=function(){ document.getElementById("drinks").scrollIntoView({behavior:"smooth",block:"start"}); };
document.getElementById("prevBtn").onclick=function(){goStep(idx-1);};
document.getElementById("nextBtn").onclick=function(){goStep(idx+1);};

}

function confetti(){
  var c=document.getElementById("confetti"), cols=["#f6c445","#c8402f","#4f9a3c","#8a5a32","#ffffff"], h="";
  for(var i=0;i<40;i++){
    h+='<i style="left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-delay:'+(Math.random()*.6).toFixed(2)+'s;animation-duration:'+(1.8+Math.random()*1.4).toFixed(2)+'s"></i>';
  }
  c.innerHTML=h; setTimeout(function(){ c.innerHTML=""; }, 3600);
}

/* routing (hash keeps the phone's Back button working) */
var PARENT = {hub:"home", coffee:"hub", arts:"hub", stage:"arts", thanks:"hub"};
function current(){ var n=(location.hash||"").replace(/^#\/?/,"")||"home"; return document.getElementById("s-"+n)?n:"home"; }
function route(){
  var name=current();
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.toggle("active", s.id==="s-"+name); });
  document.getElementById("backBtn").classList.toggle("hidden", name==="home");
  document.getElementById("homeBtn").classList.toggle("hidden", name==="home"||name==="hub");
  if(name==="coffee") setTimeout(function(){goStep(idx,true);},0);
  if(name==="hub") showVisited();
  if(name==="thanks") confetti();
  markVisited(name);
  document.querySelectorAll("#s-"+name+" .fig").forEach(loadFig);
  window.scrollTo(0,0);
  if(name!=="stage") stopAll();
}
function go(name){ location.hash = "#/"+name; }
document.addEventListener("click", function(e){ var el=e.target.closest("[data-go]"); if(el) go(el.getAttribute("data-go")); });
document.addEventListener("keydown", function(e){ if(e.key==="Enter"){ var el=document.activeElement; if(el && el.dataset && el.dataset.go) go(el.dataset.go); } });
document.getElementById("backBtn").onclick=function(){ go(PARENT[current()]||"home"); };
document.getElementById("homeBtn").onclick=function(){ go("hub"); };
window.addEventListener("hashchange", route);

/* audio */
var PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>';
var PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
var tracks=Array.prototype.slice.call(document.querySelectorAll(".track"));
var stageBox=document.getElementById("stageBox");
function fmt(s){ if(!isFinite(s)) return "–:––"; s=Math.floor(s); return Math.floor(s/60)+":"+("0"+s%60).slice(-2); }
function stopAll(except){ tracks.forEach(function(t){ var a=t.querySelector("audio"); if(a!==except && !a.paused) a.pause(); }); }
function syncLive(){ stageBox.classList.toggle("live", tracks.some(function(t){ return !t.querySelector("audio").paused; })); }
tracks.forEach(function(t){
  var a=t.querySelector("audio"), btn=t.querySelector(".play"), bar=t.querySelector(".bar"), fill=bar.querySelector("i"),
      soon=t.querySelector(".soon"), cur=t.querySelector(".cur"), dur=t.querySelector(".dur"), knob=bar.querySelector("b"), dragging=false;
  function paint(f){ fill.style.width=(f*100)+"%"; knob.style.left=(f*100)+"%"; }
  function missing(){ btn.disabled=true; soon.hidden=false; }
  a.addEventListener("error", missing);
  a.addEventListener("play", function(){ btn.innerHTML=PAUSE; t.classList.add("playing"); syncLive(); });
  a.addEventListener("pause", function(){ btn.innerHTML=PLAY; t.classList.remove("playing"); syncLive(); });
  a.addEventListener("ended", function(){ btn.innerHTML=PLAY; paint(0); t.classList.remove("playing"); syncLive(); });
  a.addEventListener("loadedmetadata", function(){ dur.textContent=fmt(a.duration); });
  a.addEventListener("timeupdate", function(){ if(a.duration && !dragging){ paint(a.currentTime/a.duration); cur.textContent=fmt(a.currentTime); } });
  btn.addEventListener("click", function(){
    if(a.paused){ stopAll(a); var p=a.play(); if(p && p.catch) p.catch(function(){ if(a.error||a.networkState===3) missing(); }); }
    else a.pause();
  });
  /* seeking: tap or drag the bar, or use the ±10s buttons */
  function ready(cb){ if(a.duration) return cb(); a.preload="metadata"; a.addEventListener("loadedmetadata", function f(){ a.removeEventListener("loadedmetadata",f); cb(); }); a.load(); }
  function frac(e){ var r=bar.getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)); }
  bar.addEventListener("pointerdown", function(e){
    var f=frac(e); dragging=true; bar.classList.add("drag"); paint(f);
    try{ bar.setPointerCapture(e.pointerId); }catch(_){}
    ready(function(){ cur.textContent=fmt(f*a.duration); });
  });
  bar.addEventListener("pointermove", function(e){
    if(!dragging) return; var f=frac(e); paint(f); if(a.duration) cur.textContent=fmt(f*a.duration);
  });
  function endDrag(e){
    if(!dragging) return; var f=frac(e); dragging=false; bar.classList.remove("drag");
    ready(function(){ a.currentTime=f*a.duration; paint(f); cur.textContent=fmt(a.currentTime); });
  }
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", function(){ dragging=false; bar.classList.remove("drag"); });
  bar.addEventListener("keydown", function(e){
    var d=e.key==="ArrowRight"?5:e.key==="ArrowLeft"?-5:0; if(!d) return; e.preventDefault();
    ready(function(){ a.currentTime=Math.max(0,Math.min(a.duration,a.currentTime+d)); });
  });
  t.querySelectorAll(".skip").forEach(function(sb){
    sb.addEventListener("click", function(){
      var d=+sb.dataset.skip; ready(function(){ a.currentTime=Math.max(0,Math.min(a.duration-0.5,a.currentTime+d)); paint(a.currentTime/a.duration); cur.textContent=fmt(a.currentTime); });
    });
  });
  if(/^https?:/.test(location.protocol)){
    try{ var x=new XMLHttpRequest(); x.open("HEAD", a.getAttribute("src"));
      x.onload=function(){ if(x.status>=400) missing(); }; x.onerror=missing; x.send(); }catch(e){ missing(); }
  }
});

applyLang();
route();
</script>
</body>
</html>
